{% extends "base.html" %}
{% block title %}Change Password{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h2>Change Password</h2>
    <form method="POST">
      <div class="form-group">
        <label for="current_password">Current Password</label>
        <input type="password" id="current_password" name="current_password" class="form-input" required autofocus />
      </div>
      <div class="form-group">
        <label for="new_password">New Password <small>(min 6 characters)</small></label>
        <input type="password" id="new_password" name="new_password" class="form-input" required minlength="6" />
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirm New Password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-input" required minlength="6" />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Update Password</button>
      <a href="{{ url_for('index') }}" class="btn btn-ghost btn-block" style="margin-top:.5rem">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
